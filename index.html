<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b1020" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>BlockAcademy · A Science Adventure in a Voxel World</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧊</text></svg>" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Register PWA service worker (secure contexts only — skips local http dev).
      // 注意：用带版本号的文件名（sw.v3.js）。若沿用固定名 sw.js，边缘/浏览器
      // 缓存会让新版 SW 迟迟不到岗，旧 SW 会继续把旧 App 锁在手机本地。
      // index.html 本身是 must-revalidate，用户每次都能拿到最新的注册地址。
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          const hadController = !!navigator.serviceWorker.controller;
          let reloaded = false;
          // 新版本 SW 接管后自动刷新一次，防止手机停在旧 bundle 上
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController || reloaded) return;
            reloaded = true;
            window.location.reload();
          });
          navigator.serviceWorker.register('/sw.v3.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
