<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a" />
      <stop offset="1" stop-color="#0b1020" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <g transform="translate(256 268)">
    <!-- top (grass) -->
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="#7ed957" />
    <!-- left (dirt) -->
    <polygon points="-104,-60 0,0 0,120 -104,60" fill="#8a5a2b" />
    <!-- right (dirt, darker) -->
    <polygon points="104,-60 0,0 0,120 104,60" fill="#6b4420" />
    <!-- grass edge highlight -->
    <polygon points="0,-120 104,-60 0,0 -104,-60" fill="none" stroke="#a6f57e" stroke-width="6" opacity="0.5" />
  </g>
  <!-- atom hint -->
  <circle cx="256" cy="118" r="11" fill="#9fe8ff" />
  <ellipse cx="256" cy="118" rx="34" ry="13" fill="none" stroke="#9fe8ff" stroke-width="4" opacity="0.7" transform="rotate(30 256 118)" />
  <ellipse cx="256" cy="118" rx="34" ry="13" fill="none" stroke="#9fe8ff" stroke-width="4" opacity="0.7" transform="rotate(-30 256 118)" />
</svg>
